<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMG Videos - Catalogo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="galeria.html">UMG Videos</a>
        <div class="d-flex align-items-center" id="authArea"></div>
    </div>
</nav>

<div class="container-fluid px-4 mt-4">

    <div class="row mb-4 g-2 align-items-center">
        <div class="col-md-8">
            <input type="text" id="buscador" class="form-control"
                   placeholder="Buscar videos por titulo...">
        </div>
        <div class="col-md-4">
            <select id="filtroCategoria" class="form-select">
                <option value="todas">Todas las categorias</option>
                <!-- las categorias se cargan dinamicamente -->
            </select>
        </div>
    </div>

    <div class="row" id="grid">
        <!-- las tarjetas de video se insertan aqui via JS -->
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/galeria.js"></script>

</body>
</html>
